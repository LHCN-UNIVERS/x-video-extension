<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  body {
    width: 280px;
    margin: 0;
    padding: 16px;
    font-family: -apple-system, system-ui, sans-serif;
    background: #14121f;
    color: #f5f0ff;
  }
  .logo {
    font-weight: 800;
    font-size: 15px;
    margin-bottom: 4px;
  }
  .logo span {
    color: #ff5cb3;
  }
  p {
    font-size: 12px;
    color: #aba3c4;
    margin: 0 0 12px;
    line-height: 1.4;
  }
  input {
    width: 100%;
    box-sizing: border-box;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1.5px solid #2c2645;
    background: #1c1730;
    color: #f5f0ff;
    font-size: 12px;
    margin-bottom: 8px;
  }
  button {
    width: 100%;
    padding: 9px;
    border-radius: 8px;
    border: none;
    background: #ff3ea5;
    color: white;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover {
    background: #ff5cb3;
  }
  .hint {
    margin-top: 10px;
    font-size: 11px;
    color: #6b6580;
  }
</style>
</head>
<body>
  <div class="logo">SaveNow<span>X</span></div>
  <p>Paste a link to a public X post, or just click the download button that appears on any video while browsing X.</p>
  <input id="url-input" type="text" placeholder="https://x.com/username/status/..." />
  <button id="open-btn">Open in SaveNowX</button>
  <div class="hint">Works on any public post with a video.</div>
  <script src="popup.js"></script>
</body>
</html>
